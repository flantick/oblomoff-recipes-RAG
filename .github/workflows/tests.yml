name: tests

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.ci.txt

      # requirements.ci.txt, not requirements.txt: the suite needs neither the
      # GPU stack nor docker, and skipping it keeps the run around a minute.
      - name: Install test dependencies
        run: pip install -r requirements.ci.txt

      # No coverage gate on purpose: the project measures coverage by hand and
      # treats a percentage target as a bad goal.
      - name: Run the test suite
        run: pytest -q
